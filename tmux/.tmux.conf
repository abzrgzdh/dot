# %{{{ Misc. Settings -------------------------------------------------------------------

if-shell 'uname | grep -q Darwin' { set-option -g default-shell /opt/homebrew/bin/zsh }
# if-shell 'uname | grep -q Darwin' { set-option -g default-command "/opt/homebrew/bin/zsh -i" }

set-option -g bell-action none
set-option -g visual-bell off

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ',*:Tc'

# the cursor shape
# set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'
# undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
# underscore colours
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set-option -g history-limit 100000
setw -g aggressive-resize on
set -g mouse on
set -sg escape-time 0
set -g display-panes-time 2000

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set-option -w -g automatic-rename off

setw -g monitor-activity on
set -g visual-activity off
set -g focus-events on
set-option -g bell-action none
set-option -g visual-bell off

set-option -g set-titles on
set-option -g set-titles-string '[#S]: #{pane_current_path}'

# Make sure we always start at 1, even when invoked from a .tmux wrapper script.
set-environment -g SHLVL 0
# Don't wrap searches
set-option -w -g wrap-search off

# Handle sessions upon exit (switch to another if exists or exit tmux)
set-option -g detach-on-destroy off

# Color of selection or copy-mode
set -g mode-style "fg=black,bg=white"
# Color of command mode in statusline
set -g message-style "bg=white,fg=black"

# Set inactive/active window styles
#   14161b: NvimDark background
#   e0e2ea: NvimDark foreground

# NICE
set -g window-style 'fg=default,bg=default'
set -g window-active-style 'fg=default,bg=#0a0a0a'

# DEFAULT
# set -g window-style 'fg=default,bg=default'
# set -g window-active-style 'fg=default,bg=default'

set-option -ga pane-border-style 'bg=default,fg=default'
set-option -ga pane-active-border-style 'bg=default,fg=default'

# set -g window-style 'fg=default,bg=default'
# set -g window-active-style 'fg=default,bg=default'
# set-option -ga pane-border-style 'bg=default,fg=default'
# set-option -ga pane-active-border-style 'bg=default,fg=default'


# set -g window-style 'fg=default,bg=default'
# set -g window-active-style 'fg=default,bg=default'
# set-option -ga pane-border-style 'bg=#24262b,fg=default'
# set-option -ga pane-active-border-style 'bg=#24262b,fg=default'



# set -g window-style 'fg=default,bg=#2c2e33'
# set -g window-active-style 'fg=default,bg=#14161b'
# set-option -ga pane-border-style 'bg=#1d1f21,fg=default'
# set-option -ga pane-active-border-style 'bg=#1d1f21,fg=default'




# %}}}

# %{{{ Statusline -----------------------------------------------------------------------

set-option -g status on
set -g status-position bottom
set -g status-justify centre
set -g status-interval 5

set -g window-status-activity-style none
set -g window-status-bell-style fg=yellow,underscore

# Add : to the default list (" -_@") of word separators.
set-option -ga word-separators :/


# ACME
# set -g status-bg "#999957"
# set -g status-fg "white"

set -g status-bg "#0c0d0c"
set -g status-fg "dimgray"


set -g status-left-length 18
set -g status-left '[#{=/15/>:session_name}] '
set -g status-right-length 50
# set -g status-right '#[fg=#888888]%H:%M | %a | %b %d'
set -g status-right ''
# set -g status-right '#[fg=default] #(~/.local/bin/scripts/tmux-music-status.sh)'

# ACME
# setw -g window-status-format ' #W#F '
# setw -g window-status-current-format '#[bold,bg=white,fg=black] #W#[fg=black]#F '

# -- dark theme
set-option -g window-status-separator ''
setw -g window-status-format ' #[fg=#484848]#W#F '
setw -g window-status-current-format '#[bg=#242424] #W#F #[bg=default]'


# set -g window-style 'fg=default,bg=#24262b'
# set -g window-active-style 'bg=#14161b'

# set -g window-style 'fg=default,bg=default'
# set -g window-active-style 'bg=default,fg=default'

# # -- light theme
# setw -g window-status-current-format ' #I#[fg=#000000]:#[fg=#000000]#W#[fg=50aaaa]#F '
# setw -g window-status-format ' #[fg=#888888]#I:#W#F '

# setw -g window-status-current-format ' #I:#[bold]#W#F '
# setw -g window-status-format ' #[fg=#777777]#I:#[fg=#999999]#W#[fg=gray]#F '

# %}}}

# %{{{ bindings  ------------------------------------------------------------------------

unbind-key C-b
unbind C-b
set -g prefix C-s
bind-key C-s send-prefix

bind r source-file ~/.tmux.conf
bind C-l clear-history

# Create new windows/panes in same directory
bind c new-window -c "#{pane_current_path}"
bind "\"" split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Stay in copy mode on drag end.
unbind-key -T copy-mode-vi MouseDragEnd1Pane

# Reenable automatic renaming for the current window
bind R setw automatic-rename on \; display-message "automatic rename enabled"

# Search back to last prompt
# bind-key b copy-mode\; send-keys -X start-of-line\; send-keys -X search-backward "➜ " \; send-keys -X next-word
# bind-key b copy-mode\; send-keys -X start-of-line\; send-keys -X search-backward '% ' \; send-keys -X next-word
bind-key b copy-mode\; send-keys -X start-of-line\; send-keys -X search-backward '% ' \; send-keys -X next-word

# Go to session 0:vpn
bind-key V switch-client -t 0:vpn

bind-key -r i run-shell "tmux neww tmux-cht.sh"
bind-key -r m run-shell "tmux neww play_music.sh"
bind-key -r M run-shell "tmux neww tmux-dict.sh"

bind-key -r 'C-f' run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key -r 'f' run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key -r '.' run-shell "tmux neww ~/.local/bin/tmux-sessionizer -s 0" # open project_root_dir
bind-key -r '+' run-shell "~/.local/bin/tmux-sessionizer -s 1 --hsplit"  # math

# back to last window
bind-key -n 'M-o' 'last-window'
# bind-key 'o' last-window

# Switch back and forth between current and Old seesion
bind-key 'O' 'switch-client -l'

bind -n M-j previous-window
bind -n M-k next-window
bind -n M-h switch-client -p
bind -n M-l switch-client -n

# Toggle status bar visibility
# https://dev.to/rahuldhole/tmux-toggle-status-bar-288m
bind B run-shell "tmux setw -g status \$(tmux show -g -w status | grep -q off && echo on || echo off)"

# Easier zoom toggle
bind -r C-d resize-pane -Z

# Easier navigation
bind -r C-k select-pane -U
bind -r C-j select-pane -D

# Take todo
bind -r ';' neww -n "todo" -c "#{pane_current_path}" "[[ -e TODO.md ]] && $EDITOR TODO.md || $EDITOR '+cd %:p:h' ~/.log.txt"
# # Capture todo
# bind -r T neww -n "#[fg=darkblue,italics]capture[todo]#[default]" -c "#{pane_current_path}" "sh ~/.local/bin/scripts/capture-todo.sh"
# # Capture a thought into journal
# bind -r C neww -n "#[fg=color187,italics]capture[jrnl]#[default]" -c "#{pane_current_path}" "sh ~/.local/bin/scripts/capture-jrnl.sh"
# Open vocab list
bind -r v neww -n "vocab" -c "#{pane_current_path}" "$EDITOR ~/workspace/probe/english/random.txt"

bind-key -n 'M-p' run-shell "tmux neww fpdf"

# Emulate scrolling by sending up and down keys if these commands are running in the pane
tmux_commands_with_legacy_scroll="nano less more man git"
bind-key -T root WheelUpPane \
  if-shell -Ft= '#{?mouse_any_flag,1,#{pane_in_mode}}' \
    'send -Mt=' \
    'if-shell -t= "#{?alternate_on,true,false} || echo \"#{tmux_commands_with_legacy_scroll}\" | grep -q \"#{pane_current_command}\"" \
      "send -t= Up" "copy-mode -et="'
bind-key -T root WheelDownPane \
  if-shell -Ft = '#{?pane_in_mode,1,#{mouse_any_flag}}' \
    'send -Mt=' \
    'if-shell -t= "#{?alternate_on,true,false} || echo \"#{tmux_commands_with_legacy_scroll}\" | grep -q \"#{pane_current_command}\"" \
      "send -t= Down" "send -Mt="'

# %}}}

# %{{{ vi mode --------------------------------------------------------------------------

setw -g mode-keys vi

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5

bind -T copy-mode-vi "v" send -X begin-selection
bind -T copy-mode-vi "r" send -X rectangle-toggle
bind -T copy-mode-vi "V" send -X select-line

if-shell 'uname | grep -q Linux' { bind-key -T copy-mode-vi "y" send-keys -X copy-pipe-and-cancel 'xclip -sel clip -i' }
if-shell 'uname | grep -q Linux' { bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'xclip -sel clip -i' }
if-shell 'uname | grep -q Darwin' { bind-key -T copy-mode-vi "y" send-keys -X copy-pipe-and-cancel 'pbcopy' }
if-shell 'uname | grep -q Darwin' { bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'pbcopy' }

# Scroll 3 lines at a time instead of default 5; don't extend dragged selections.
bind-key -T copy-mode-vi WheelUpPane select-pane\; send-keys -t'{mouse}' -X clear-selection\; send-keys -t'{mouse}' -X -N 3 scroll-up
bind-key -T copy-mode-vi WheelDownPane select-pane\; send-keys -t'{mouse}' -X clear-selection\; send-keys -t'{mouse}' -X -N 3 scroll-down

# https://github.com/wincent/wincent/blob/bb727efaa67196ef6d66971f49ead5041eaa82fd/aspects/dotfiles/files/.tmux.conf#L155
bind-key -T copy-mode-vi / command-prompt -i -p "search down" "send -X search-forward-incremental \"%%%\""
bind-key -T copy-mode-vi ? command-prompt -i -p "search up" "send -X search-backward-incremental \"%%%\""

bind-key -r N run-shell "tmux neww ncmpcpp"
bind-key -r P run-shell "tmux neww tmux-pdf.sh"

# %}}}

# vim: fdm=marker
